<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>06 — Kinetic Desk</title><style>*{box-sizing:border-box}html,body{margin:0;font-family:Arial,sans-serif;color:#101518;background:#fbfaf6}body{height:300vh}.stage{position:sticky;top:0;height:100svh;overflow:hidden}.logo{position:absolute;z-index:20;top:24px;left:24px;font-weight:900;letter-spacing:-.05em}.copy{position:absolute;z-index:10;inset:0;display:grid;place-content:center;text-align:center;padding:24px;pointer-events:none}.copy h1{font-size:clamp(48px,9vw,130px);line-height:.84;letter-spacing:-.075em;margin:0;max-width:1000px}.copy p{font-size:clamp(16px,2vw,23px);max-width:520px;margin:26px auto 0}.obj{position:absolute;border:1px solid #172126;background:white;box-shadow:0 18px 50px #17212622;padding:14px;transition:filter .2s}.mail{width:240px;left:5%;top:20%;transform:rotate(-10deg)}.excel{width:260px;right:4%;top:18%;transform:rotate(7deg)}.phone{width:145px;right:12%;bottom:10%;border:5px solid #172126;border-radius:25px}.paper{width:220px;left:10%;bottom:8%;transform:rotate(8deg)}.cup{width:100px;height:100px;border-radius:50%;right:34%;top:8%;background:#dff4f8}.post{width:160px;height:140px;background:#bfefff;left:35%;bottom:5%;transform:rotate(-4deg)}.obj b{display:block;font-size:13px;margin-bottom:12px}.lines{background:repeating-linear-gradient(#d7dee2 0 1px,transparent 1px 15px);height:70px}.core{position:absolute;width:180px;height:180px;border-radius:50%;left:50%;top:50%;translate:-50% -50%;border:1px dashed #66bcd0;opacity:0}.final{position:absolute;inset:auto 50% 12%;translate:50% 0;background:#101518;color:white;padding:16px 24px;font-weight:700;opacity:0}.hint{position:absolute;bottom:22px;left:24px;font-size:11px;letter-spacing:.15em}.blue{color:#1684a7}@media(max-width:600px){.copy{align-content:start;padding-top:21vh}.copy h1{font-size:15vw}.copy p{font-size:15px;max-width:300px}.obj{scale:.72}.mail{left:-12%;top:52%}.excel{right:-14%;top:49%}.phone{right:-5%;bottom:5%}.paper{left:-8%;bottom:3%}.cup{right:8%;top:6%}.post{left:30%;bottom:0}.core{width:120px;height:120px}.final{bottom:12%;font-size:12px;white-space:nowrap}}</style></head><body><div class="stage"><div class="logo">STEALTH<span class="blue">•</span></div><div class="copy"><h1>Quanto lavoro c’è <span class="blue">attorno</span> al tuo lavoro?</h1><p>Mail, fogli, telefonate, file, firme. Scorri: il rumore converge in un solo strumento.</p></div><div class="core"></div><div class="obj mail"><b>EMAIL · urgente</b><div class="lines"></div></div><div class="obj excel"><b>EXCEL · definitivo_v7</b><div class="lines"></div></div><div class="obj phone"><b>WhatsApp</b><div class="lines"></div></div><div class="obj paper"><b>RAPPORTINO</b><div class="lines"></div></div><div class="obj cup"></div><div class="obj post"><b>RICHIAMARE LUCA</b><div class="lines"></div></div><div class="final">Un posto solo. Il tuo.</div><div class="hint">SCORRI ↓</div></div><script>const els=[...document.querySelectorAll('.obj')],core=document.querySelector('.core'),final=document.querySelector('.final'),copy=document.querySelector('.copy');addEventListener('scroll',()=>{let p=Math.min(1,scrollY/(innerHeight*1.65));els.forEach((e,i)=>{let r=e.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,dx=innerWidth/2-cx,dy=innerHeight/2-cy;e.style.transform=`translate(${dx*p*.82}px,${dy*p*.82}px) rotate(${(i-2)*p*2}deg) scale(${1-p*.45})`;e.style.opacity=1-p*.72});core.style.opacity=p;core.style.transform=`scale(${.45+p*.9})`;copy.style.opacity=1-Math.max(0,(p-.35)*1.5);final.style.opacity=Math.max(0,(p-.72)*3.5)})</script></body></html>
