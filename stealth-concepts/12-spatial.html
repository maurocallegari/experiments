<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>12 — Spatial</title><style>*{box-sizing:border-box}body{margin:0;background:#e9f4f6;color:#102026;font-family:Arial,sans-serif;height:350vh}.stage{position:sticky;top:0;height:100svh;overflow:hidden;perspective:900px}.brand{position:absolute;top:24px;left:24px;font-weight:900;z-index:20}.copy{position:absolute;left:5vw;top:13vh;z-index:15;max-width:720px}.copy h1{font-size:clamp(48px,9vw,125px);line-height:.83;letter-spacing:-.08em;margin:0}.copy p{font-size:18px;max-width:450px}.room{position:absolute;left:50%;top:62%;width:900px;height:600px;transform:translate(-50%,-50%) rotateX(58deg) rotateZ(-34deg);transform-style:preserve-3d}.desk{position:absolute;inset:100px;background:#fff;border:2px solid #102026;box-shadow:30px 30px 0 #b3e8f2}.tile{position:absolute;width:190px;height:130px;background:white;border:2px solid;padding:15px;box-shadow:12px 12px 0 #10202622;transform:translateZ(40px)}.t1{left:80px;top:80px}.t2{right:70px;top:110px}.t3{left:290px;bottom:60px}.t4{right:180px;bottom:80px}.tile b{font-size:12px}.lines{height:75px;margin-top:12px;background:repeating-linear-gradient(#c9d6da 0 2px,transparent 2px 14px)}.system{position:absolute;left:50%;top:50%;translate:-50% -50%;width:350px;height:220px;background:#102026;color:#a9efff;display:grid;place-content:center;text-align:center;transform:translateZ(100px) scale(.2);opacity:0}.system b{font-size:34px;letter-spacing:-.06em}.caption{position:absolute;right:5vw;bottom:6vh;font-size:clamp(25px,4vw,55px);font-weight:800;max-width:520px;text-align:right;opacity:0}@media(max-width:650px){.copy{left:20px;right:20px;top:11vh}.copy h1{font-size:16vw}.copy p{font-size:15px}.room{width:620px;height:480px;top:66%}.desk{inset:90px}.tile{width:135px;height:95px;padding:9px}.t1{left:70px}.t2{right:55px}.t3{left:220px}.t4{right:120px}.lines{height:50px}.system{width:230px;height:150px}.system b{font-size:24px}.caption{right:20px;left:20px;bottom:7vh;font-size:31px}}</style></head><body><div class="stage"><div class="brand">STEALTH•</div><div class="copy"><h1>Entriamo nel tuo <span style="color:#168ba9">modo di lavorare.</span></h1><p>Non partiamo dal software. Partiamo dalla tua scrivania, dalle persone, dai passaggi veri.</p></div><div class="room"><div class="desk"></div><div class="tile t1"><b>EMAIL</b><div class="lines"></div></div><div class="tile t2"><b>FOGLIO</b><div class="lines"></div></div><div class="tile t3"><b>EXCEL</b><div class="lines"></div></div><div class="tile t4"><b>TELEFONO</b><div class="lines"></div></div><div class="system"><b>IL TUO<br>SISTEMA.</b></div></div><div class="caption">Poi costruiamo qualcosa che <span style="color:#168ba9">sta esattamente lì.</span></div></div><script>const room=document.querySelector('.room'),tiles=[...document.querySelectorAll('.tile')],sys=document.querySelector('.system'),copy=document.querySelector('.copy'),cap=document.querySelector('.caption');addEventListener('scroll',()=>{let p=Math.min(1,scrollY/(innerHeight*2.3));room.style.transform=`translate(-50%,-50%) rotateX(${58-p*35}deg) rotateZ(${-34+p*30}deg) scale(${1-p*.08})`;tiles.forEach((t,i)=>{t.style.opacity=1-p*.8;t.style.transform=`translateZ(${40+p*(i+1)*45}px) translate(${(i%2?1:-1)*p*90}px,${p*(i-1)*35}px)`});sys.style.opacity=Math.max(0,(p-.45)*2);sys.style.transform=`translateZ(100px) scale(${.2+Math.max(0,p-.35)*1.15})`;copy.style.opacity=1-p*1.4;cap.style.opacity=Math.max(0,(p-.68)*3)})</script></body></html>
