<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>09 — Magnetic</title><style>*{box-sizing:border-box}body{margin:0;background:#f7fbfc;color:#0e171b;font-family:Arial,sans-serif;height:320vh}.stage{position:sticky;top:0;height:100svh;overflow:hidden}.logo{position:absolute;top:22px;left:24px;font-weight:900;z-index:10}.rings{position:absolute;left:50%;top:50%;translate:-50% -50%;width:min(72vw,720px);aspect-ratio:1;border:1px solid #9bdce9;border-radius:50%}.rings:before,.rings:after{content:"";position:absolute;border:1px solid #bceaf2;border-radius:50%;inset:13%}.rings:after{inset:28%}.center{position:absolute;left:50%;top:50%;translate:-50% -50%;width:170px;height:170px;background:#10191d;color:white;border-radius:50%;display:grid;place-content:center;text-align:center;z-index:5;font-weight:900;font-size:23px}.center span{color:#9eeeff}.orbit{position:absolute;left:50%;top:50%;width:150px;padding:12px;background:white;border:1px solid;box-shadow:0 12px 30px #1232;z-index:4}.o1{margin:-290px 0 0 -70px}.o2{margin:-100px 0 0 260px}.o3{margin:210px 0 0 120px}.o4{margin:170px 0 0 -310px}.o5{margin:-130px 0 0 -350px}.orbit b{font-size:11px}.orbit p{font-size:10px;color:#69747a}.copy{position:absolute;left:5vw;bottom:6vh;max-width:620px;z-index:8}.copy h1{font-size:clamp(42px,7vw,95px);letter-spacing:-.07em;line-height:.87;margin:0}.copy2{position:absolute;right:5vw;top:12vh;max-width:430px;text-align:right;font-size:clamp(24px,4vw,50px);font-weight:800;line-height:.95;opacity:0}@media(max-width:650px){.rings{width:125vw}.center{width:120px;height:120px;font-size:17px}.orbit{width:105px;padding:8px}.o1{margin:-220px 0 0 -50px}.o2{margin:-90px 0 0 130px}.o3{margin:145px 0 0 60px}.o4{margin:130px 0 0 -170px}.o5{margin:-110px 0 0 -190px}.copy{left:20px;right:20px;bottom:7vh}.copy h1{font-size:13vw}.copy2{right:20px;left:20px;top:13vh;font-size:34px}}</style></head><body><div class="stage"><div class="logo">STEALTH•</div><div class="rings"></div><div class="center">IL TUO<br><span>LAVORO</span></div><div class="orbit o1"><b>EMAIL</b><p>“Mi mandi il PDF?”</p></div><div class="orbit o2"><b>EXCEL</b><p>copia / incolla</p></div><div class="orbit o3"><b>WHATSAPP</b><p>foto + nota vocale</p></div><div class="orbit o4"><b>CARTA</b><p>firma e archivia</p></div><div class="orbit o5"><b>WORD</b><p>preventivo_finale_3</p></div><div class="copy"><h1>Troppe cose ti girano <span style="color:#178ba9">attorno.</span></h1></div><div class="copy2">Le facciamo convergere.<br>Tu resti al centro.</div></div><script>const os=[...document.querySelectorAll('.orbit')],c1=document.querySelector('.copy'),c2=document.querySelector('.copy2');let base=[];requestAnimationFrame(()=>base=os.map(o=>{let r=o.getBoundingClientRect();return{x:r.left+r.width/2,y:r.top+r.height/2}}));addEventListener('scroll',()=>{let p=Math.min(1,scrollY/(innerHeight*2));os.forEach((o,i)=>{let b=base[i]||{x:innerWidth/2,y:innerHeight/2},dx=innerWidth/2-b.x,dy=innerHeight/2-b.y;o.style.transform=`translate(${dx*p*.72}px,${dy*p*.72}px) rotate(${p*(i%2?12:-12)}deg) scale(${1-p*.25})`;o.style.opacity=1-p*.55});document.querySelector('.rings').style.transform=`rotate(${p*55}deg) scale(${1-p*.18})`;c1.style.opacity=1-p*1.4;c2.style.opacity=Math.max(0,(p-.55)*2.5)})</script></body></html>
