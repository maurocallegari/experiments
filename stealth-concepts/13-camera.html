<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>13 — Camera Zoom</title><style>*{box-sizing:border-box}body{margin:0;background:#fff;color:#101619;font-family:Arial,sans-serif;height:420vh}.stage{position:sticky;top:0;height:100svh;overflow:hidden}.brand{position:absolute;top:22px;left:24px;z-index:20;font-weight:900}.world{position:absolute;left:50%;top:50%;width:1200px;height:800px;transform:translate(-50%,-50%) scale(.72);transform-origin:50% 50%}.headline{position:absolute;left:50%;top:50%;translate:-50% -50%;text-align:center;width:900px}.headline h1{font-size:120px;line-height:.82;letter-spacing:-.08em;margin:0}.headline p{font-size:20px}.object{position:absolute;background:#fff;border:2px solid;padding:18px;box-shadow:12px 12px 0 #c7eff6}.mail{left:40px;top:80px;width:260px;height:170px;transform:rotate(-8deg)}.excel{right:30px;top:100px;width:300px;height:190px;transform:rotate(6deg)}.paper{left:100px;bottom:40px;width:220px;height:260px;transform:rotate(5deg)}.phone{right:120px;bottom:30px;width:150px;height:280px;border:6px solid;border-radius:28px}.object b{font-size:13px}.lines{height:110px;margin-top:15px;background:repeating-linear-gradient(#ccd7db 0 2px,transparent 2px 17px)}.micro{position:absolute;left:50%;top:50%;translate:-50% -50%;width:160px;height:100px;background:#111;color:white;display:grid;place-content:center;text-align:center;font-size:12px;opacity:0}.ending{position:absolute;inset:0;background:#bceffa;display:grid;place-content:center;text-align:center;padding:25px;opacity:0;z-index:15}.ending h2{font-size:clamp(50px,11vw,150px);line-height:.8;letter-spacing:-.08em;margin:0}.ending p{font-size:18px}.reticle{position:absolute;left:50%;top:50%;width:80px;height:80px;border:1px solid #178aa9;border-radius:50%;translate:-50% -50%;z-index:10}.reticle:before,.reticle:after{content:"";position:absolute;background:#178aa9}.reticle:before{width:120px;height:1px;left:-20px;top:39px}.reticle:after{height:120px;width:1px;top:-20px;left:39px}@media(max-width:650px){.world{scale:.42}.headline h1{font-size:115px}.brand{font-size:13px}.ending h2{font-size:17vw}}</style></head><body><div class="stage"><div class="brand">STEALTH• / METTI A FUOCO</div><div class="reticle"></div><div class="world"><div class="headline"><h1>Quanto tempo perdi in cose inutili?</h1><p>Scorri. Andiamo a vedere dove.</p></div><div class="object mail"><b>EMAIL</b><div class="lines"></div></div><div class="object excel"><b>EXCEL</b><div class="lines"></div></div><div class="object paper"><b>RAPPORTINO</b><div class="lines"></div></div><div class="object phone"><b>WHATSAPP</b><div class="lines"></div></div><div class="micro">COPIA<br>LO STESSO DATO<br>3 VOLTE</div></div><div class="ending"><h2>ECCO.<br><span style="color:white">PARTIAMO DA QUI.</span></h2><p>Stealth osserva il lavoro vero e costruisce il sistema attorno a te.</p></div></div><script>const world=document.querySelector('.world'),micro=document.querySelector('.micro'),end=document.querySelector('.ending'),ret=document.querySelector('.reticle');addEventListener('scroll',()=>{let p=Math.min(1,scrollY/(innerHeight*3));let zoom=1+p*4.5;world.style.transform=`translate(-50%,-50%) scale(${zoom*.72}) translate(${p*-7}%,${p*5}%)`;micro.style.opacity=Math.max(0,Math.min(1,(p-.35)*4));ret.style.transform=`scale(${1-p*.55})`;end.style.opacity=Math.max(0,(p-.82)*6)})</script></body></html>
