<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>08 — Conveyor</title><style>*{box-sizing:border-box}body{margin:0;background:#fff;color:#111;font-family:Arial,sans-serif;height:360vh}.stage{height:100svh;position:sticky;top:0;overflow:hidden;background:linear-gradient(#fff 0 72%,#e8f8fb 72%)}.logo{position:absolute;top:24px;left:24px;font-weight:900}.headline{position:absolute;top:12vh;left:5vw;right:5vw}.headline h1{font-size:clamp(46px,9vw,132px);letter-spacing:-.075em;line-height:.84;margin:0;max-width:1050px}.headline p{font-size:18px;max-width:500px}.belt{position:absolute;left:0;right:0;bottom:12vh;height:120px;border-top:4px solid;border-bottom:4px solid;background:repeating-linear-gradient(90deg,transparent 0 70px,#111 71px 73px,transparent 74px 140px)}.items{position:absolute;left:0;bottom:calc(12vh + 120px);display:flex;gap:55px;width:max-content;align-items:end}.item{width:190px;height:150px;border:2px solid;background:white;padding:14px;box-shadow:8px 8px 0 #bceef7;transform-origin:bottom}.item.phone{width:110px;height:190px;border-radius:22px;border-width:5px}.item.paper{transform:rotate(-5deg)}.item b{font-size:12px}.lines{height:90px;margin-top:12px;background:repeating-linear-gradient(#ccd5d9 0 2px,transparent 2px 16px)}.machine{position:absolute;right:8vw;bottom:calc(12vh + 110px);width:260px;height:300px;background:#111;color:white;border-radius:120px 120px 15px 15px;display:grid;place-content:center;text-align:center;z-index:4}.machine b{font-size:30px;letter-spacing:-.05em}.machine span{color:#9beaff}.output{position:absolute;right:3vw;bottom:3vh;width:220px;padding:16px;background:white;border:2px solid;opacity:0;z-index:6}.output strong{font-size:22px}.hint{position:absolute;left:24px;bottom:24px;font-size:11px}@media(max-width:650px){.headline{top:10vh;left:20px;right:20px}.headline h1{font-size:16vw}.headline p{font-size:15px}.belt{bottom:9vh;height:85px}.items{bottom:calc(9vh + 85px);gap:28px}.item{width:135px;height:110px;padding:9px}.item.phone{width:80px;height:145px}.lines{height:60px}.machine{right:5vw;bottom:calc(9vh + 76px);width:150px;height:190px}.machine b{font-size:20px}.output{width:170px;right:10px;bottom:2vh}}</style></head><body><div class="stage"><div class="logo">STEALTH•</div><div class="headline"><h1>La tua azienda non è una <span style="color:#168aaa">catena di passaggi.</span></h1><p>Eppure una richiesta fa spesso questo viaggio prima di diventare lavoro.</p></div><div class="belt"></div><div class="items"><div class="item"><b>EMAIL</b><div class="lines"></div></div><div class="item"><b>EXCEL</b><div class="lines"></div></div><div class="item paper"><b>FOGLIO</b><div class="lines"></div></div><div class="item phone"><b>WA</b><div class="lines"></div></div><div class="item"><b>PDF</b><div class="lines"></div></div><div class="item"><b>GESTIONALE</b><div class="lines"></div></div></div><div class="machine"><b>STEALTH<br><span>RIDUCE.</span></b></div><div class="output"><small>RISULTATO</small><br><strong>Richiesta pronta.</strong></div><div class="hint">SCORRI LA LINEA ↓</div></div><script>const items=document.querySelector('.items'),out=document.querySelector('.output'),head=document.querySelector('.headline');addEventListener('scroll',()=>{let p=Math.min(1,scrollY/(innerHeight*2.4));let travel=Math.max(0,items.scrollWidth-innerWidth*.58);items.style.transform=`translateX(${40-p*travel}px)`;head.style.opacity=1-Math.max(0,(p-.45)*1.7);out.style.opacity=Math.max(0,(p-.78)*5)})</script></body></html>
