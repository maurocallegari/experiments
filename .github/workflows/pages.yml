name: Deploy Stealth production Pages

on:
  push:
    branches: [main]
    paths:
      - 'sito-stealth-prod/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Build production artifact
        run: |
          rm -rf _site
          cp -R sito-stealth-prod _site
          cat _site/styles-00.css _site/styles-01.css _site/styles-02.css _site/styles-03.css _site/styles-04.css _site/styles-05.css _site/styles-06.css _site/styles-07.css > _site/styles.css
          rm _site/styles-00.css _site/styles-01.css _site/styles-02.css _site/styles-03.css _site/styles-04.css _site/styles-05.css _site/styles-06.css _site/styles-07.css
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
