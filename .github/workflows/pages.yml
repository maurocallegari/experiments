name: Deploy Stealth production Pages

on:
  push:
    branches: [main]
    paths:
      - 'stealth-new/**'
      - 'stealth-gpt/**'
      - 'stealth-static/**'
      - 'stealth-ai-ios/**'
      - 'stealth-method-ios/**'
      - 'stealth-build-ios/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Build production artifact
        run: |
          rm -rf _site
          mkdir -p _site
          cp -R stealth-new/. _site/
          mkdir -p _site/stealth-new _site/stealth-gpt _site/stealth-static _site/stealth-ai-ios _site/stealth-method-ios _site/stealth-build-ios
          cp -R stealth-new/. _site/stealth-new/
          cp -R stealth-gpt/. _site/stealth-gpt/
          cp -R stealth-static/. _site/stealth-static/
          cp -R stealth-ai-ios/. _site/stealth-ai-ios/
          cp -R stealth-method-ios/. _site/stealth-method-ios/
          cp -R stealth-build-ios/. _site/stealth-build-ios/
          sed -E -i "s#style\.css\?v=[^\"]+#style.css?v=${GITHUB_SHA}#g; s#script\.js\?v=[^\"]+#script.js?v=${GITHUB_SHA}#g" _site/stealth-static/index.html
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
